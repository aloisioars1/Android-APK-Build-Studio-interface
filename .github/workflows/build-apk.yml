name: Gerar APK Instalavel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar e Buildar site
        run: |
          npm install --legacy-peer-deps
          npm run build || npx vite build
          ls -la
          ls -la dist/ || ls -la build/

      - name: Gerar Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          # Cria o config na mão pra não dar erro de appId
          echo '{"appId":"com.aloisioars.app","appName":"MeuApp","webDir":"dist"}' > capacitor.config.json
          cat capacitor.config.json
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
         ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-instalavel
          path: android/app/build/outputs/apk/debug/app-debug.apk
