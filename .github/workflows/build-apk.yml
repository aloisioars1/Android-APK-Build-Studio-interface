name: Gerar APK Instalavel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build do site
        run: |
          npm install --legacy-peer-deps
          npm run build || npx vite build
          echo "--- O QUE FOI GERADO ---"
          ls -la
          ls -la dist 2>/dev/null || ls -la build 2>/dev/null || echo "sem pasta dist/build"

      - name: Criar APK
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          # descobre onde foi o build
          if [ -d "dist" ]; then WEB="dist"; elif [ -d "build" ]; then WEB="build"; else WEB="dist"; mkdir -p dist; echo "<h1>App</h1>" > dist/index.html; fi
          echo "{\"appId\":\"com.aloisioars.app\",\"appName\":\"MeuApp\",\"webDir\":\"$WEB\"}" > capacitor.config.json
          cat capacitor.config.json
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-instalavel
          path: android/app/build/outputs/apk/debug/app-debug.apk
