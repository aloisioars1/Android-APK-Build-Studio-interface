name: Gerar APK Instalavel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ver o que tem no projeto
        run: |
          ls -la
          cat package.json

      - name: Instalar e Buildar
        run: |
          npm install --legacy-peer-deps
          npm run build || npx vite build
          ls -la dist/ || ls -la build/ || ls -la

      - name: Gerar Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "MeuApp" "com.aloisioars.app" --web-dir=dist --npm-client=npm || true
          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-instalavel
          path: android/app/build/outputs/apk/debug/app-debug.apk
